<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Instagram Feed ピッカー 設定</title>
<style>
  body { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; color: #222; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  label { display: block; font-size: 12px; color: #666; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #1f6feb; background: #1f6feb; color: #fff; cursor: pointer; margin-top: 16px; }
  .hint { font-size: 12px; color: #777; line-height: 1.6; }
  #msg { margin-top: 12px; } .ok { color: #1a7f37; } .err { color: #c00; }
</style>
</head>
<body>
<h1>Instagram Feed ピッカー 設定</h1>
<div class="row">
  <div><label for="owner">GitHub のユーザー名</label><input id="owner" placeholder="7n4jwe"></div>
  <div><label for="repo">リポジトリ名</label><input id="repo" placeholder="instagram-feed"></div>
  <div style="flex:0 0 90px"><label for="branch">ブランチ</label><input id="branch" value="main"></div>
</div>
<label for="token">アクセストークン（管理画面と同じもの：このリポジトリの Contents を Read and write）</label>
<input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
<p class="hint">トークンはこのパソコンの Chrome の中（拡張の保存領域）にだけ保存されます。</p>
<button id="save">保存して接続を確認</button>
<div id="msg"></div>
<script src="options.js"></script>
</body>
</html>
