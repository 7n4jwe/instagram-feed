<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Instagram Feed 保存用の窓</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; color: #222; background: #fff; }
  main { padding: 14px 16px; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  .state { font-size: 18px; font-weight: 700; margin: 8px 0; }
  .ok { color: #1a7f37; } .err { color: #c00; } .muted { color: #777; font-size: 12px; }
  ul { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px solid #eee; }
  li { padding: 5px 0; border-bottom: 1px solid #eee; word-break: break-all; }
  a { color: #1f6feb; }
</style>
</head>
<body>
<main>
  <h1>Instagram Feed 保存用の窓</h1>
  <p class="muted">選んでいる間は、この窓を閉じずに横へ置いておいてください。Instagram で選んだ内容をここから保存します。</p>
  <div id="state" class="state">待機中…</div>
  <div id="detail" class="muted"></div>
  <ul id="log"></ul>
</main>
<script>
/*
 * ブックマークレット「選択ボタン」から開かれる窓。
 * Instagram のページは GitHub に直接保存できない（Instagram 側の通信制限）ため、
 * この窓がメッセージを受け取り、管理画面と同じ接続設定（localStorage）で data/posts.json を読み書きする。
 * 処理の内容は extension/background.js と同じ。
 */
(function () {
  const LS = 'igFeedAdmin';
  const FILE = 'data/posts.json';
  // メッセージを受け付ける相手。Instagram のページだけ（ローカルでの動作確認時は自分自身も）
  const ALLOWED = ['https://www.instagram.com'];
  if (['localhost', '127.0.0.1'].includes(location.hostname)) ALLOWED.push(location.origin);

  const $ = (id) => document.getElementById(id);
  const adminUrl = new URL('./', location.href).href;
  function setState(text, cls, detail) { $('state').textContent = text; $('state').className = 'state ' + (cls || ''); if (detail !== undefined) $('detail').textContent = detail; }
  function log(text) {
    const li = document.createElement('li');
    li.textContent = new Date().toLocaleTimeString('ja-JP') + '　' + text;
    $('log').prepend(li);
    while ($('log').children.length > 30) $('log').lastChild.remove();
  }
  const notify = () => { try { new BroadcastChannel('igfeed').postMessage({ type: 'picked' }); } catch (_) {} };

  function getCfg() {
    let c = {};
    try { c = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (_) {}
    return { owner: (c.owner || '').trim(), repo: (c.repo || '').trim(), branch: (c.branch || 'main').trim(), token: (c.token || '').trim() };
  }
  const configured = (c) => !!(c.owner && c.repo && c.token);
  function showNotConfigured() {
    setState('接続設定がありません', 'err', '');
    $('detail').innerHTML = 'このブラウザで<a href="' + adminUrl + '" target="_blank">管理画面</a>を開き、「接続設定」でトークンを入力して接続してください。そのあと Instagram に戻れば使えます。';
  }

  const b64enc = (str) => { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); }); return btoa(bin); };
  const b64dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), (ch) => ch.charCodeAt(0)));

  async function gh(cfg, path, opts = {}) {
    const res = await fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + path, {
      ...opts,
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token, 'X-GitHub-Api-Version': '2022-11-28' },
      cache: 'no-store',
    });
    if (!res.ok) {
      let msg = res.status + ' ' + res.statusText;
      try { const j = await res.json(); if (j.message) msg += ' — ' + j.message; } catch (_) {}
      const e = new Error(msg); e.status = res.status; throw e;
    }
    return res.json();
  }
  async function readPosts(cfg) {
    const j = await gh(cfg, '/contents/' + FILE + '?ref=' + encodeURIComponent(cfg.branch));
    const data = JSON.parse(b64dec(j.content));
    data.posts = Array.isArray(data.posts) ? data.posts : [];
    data.dismissed = Array.isArray(data.dismissed) ? data.dismissed : [];
    return { sha: j.sha, data };
  }

  const CACHE_MS = 20 * 1000;
  let cache = null;
  function remember(data) {
    const approved = data.posts.filter((p) => p.approved);
    const counts = {};
    approved.forEach((p) => { if (p.author) counts[p.author] = (counts[p.author] || 0) + 1; });
    cache = { codes: approved.map((p) => p.code), profiles: Array.isArray(data.profiles) ? data.profiles : [], counts, at: Date.now() };
    setState('接続中：' + cache.codes.length + ' 件選択中', 'ok', '');
    return view();
  }
  const view = () => ({ codes: cache.codes, profiles: cache.profiles, counts: cache.counts });

  async function getSelected(force) {
    const cfg = getCfg();
    if (!configured(cfg)) { showNotConfigured(); return { ok: false, error: 'notConfigured' }; }
    if (!force && cache && Date.now() - cache.at < CACHE_MS) return { ok: true, ...view() };
    const { data } = await readPosts(cfg);
    return { ok: true, ...remember(data) };
  }

  // 読む→変更→書く。他で更新されていたら（409/422）読み直してやり直す
  async function change(fn, message) {
    const cfg = getCfg();
    if (!configured(cfg)) { showNotConfigured(); return { ok: false, error: 'notConfigured' }; }
    for (let attempt = 0; attempt < 3; attempt++) {
      const { sha, data } = await readPosts(cfg);
      if (fn(data) === false) return { ok: true, ...remember(data) }; // 変更なし
      data.updated_at = new Date().toISOString();
      try {
        await gh(cfg, '/contents/' + FILE, {
          method: 'PUT',
          body: JSON.stringify({ message, sha, branch: cfg.branch, content: b64enc(JSON.stringify(data, null, 2) + '\n') }),
        });
        notify();
        return { ok: true, ...remember(data) };
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && attempt < 2) continue;
        throw e;
      }
    }
  }

  function setSelected({ code, postType, author, select }) {
    if (!/^[A-Za-z0-9_-]{5,}$/.test(code || '')) return { ok: false, error: '投稿のコードが正しくありません' };
    const type = ['p', 'reel', 'tv'].includes(postType) ? postType : 'p';
    author = /^[a-z0-9._]{1,30}$/.test(author || '') ? author : '';
    return change((data) => {
      let p = data.posts.find((x) => x.code === code);
      if (!!(p && p.approved) === !!select) return false;
      if (select) {
        if (p) { p.approved = true; p.reviewed = true; if (!p.author && author) p.author = author; }
        else {
          data.dismissed = data.dismissed.filter((c) => c !== code);
          data.posts.push({ code, url: 'https://www.instagram.com/' + type + '/' + code + '/', author, source: 'manual', added_at: new Date().toISOString(), approved: true, reviewed: true, note: '' });
        }
      } else { p.approved = false; p.reviewed = true; }
    }, (select ? 'Select' : 'Unselect') + ' post ' + code);
  }

  function setProfile({ user, add }) {
    if (!/^[a-z0-9._]{1,30}$/.test(user || '')) return { ok: false, error: 'ユーザー名が正しくありません' };
    return change((data) => {
      data.profiles = Array.isArray(data.profiles) ? data.profiles : [];
      if (data.profiles.includes(user) === !!add) return false;
      if (add) data.profiles.push(user); else data.profiles = data.profiles.filter((u) => u !== user);
    }, (add ? 'Add' : 'Remove') + ' account ' + user);
  }

  async function handle(msg) {
    try {
      if (msg.type === 'getSelected') return await getSelected(msg.force);
      if (msg.type === 'setSelected') {
        const r = await setSelected(msg);
        if (r.ok) log((msg.select ? '✓ 選択 ' : '解除 ') + (msg.author ? '@' + msg.author + ' ' : '') + msg.code);
        return r;
      }
      if (msg.type === 'setProfile') {
        const r = await setProfile(msg);
        if (r.ok) log((msg.add ? 'アカウント登録 @' : 'アカウント解除 @') + msg.user);
        return r;
      }
      return { ok: false, error: 'unknown' };
    } catch (e) {
      setState('保存できませんでした', 'err', e.message);
      log('エラー：' + e.message);
      return { ok: false, error: e.message, status: e.status };
    }
  }

  window.addEventListener('message', async (e) => {
    if (!ALLOWED.includes(e.origin)) return;
    const d = e.data || {};
    if (d.igf !== 'req' || !d.msg || !e.source) return;
    const r = await handle(d.msg);
    try { e.source.postMessage({ igf: 'reply', id: d.id, r }, e.origin); } catch (_) {}
  });

  if (window.opener) {
    // 準備完了を知らせる（中身は合図だけなので宛先は限定しない）
    try { window.opener.postMessage({ igf: 'ready' }, '*'); } catch (_) {}
    if (!configured(getCfg())) showNotConfigured(); else setState('接続を確認中…');
  } else {
    setState('この窓は単独では使いません', '', 'Instagram を開いた状態で、ブックマークの「選択ボタン」を押してください。');
  }
})();
</script>
</body>
</html>
