<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>投稿を選ぶ</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 14px; color: #222; background: #fff; }
  main { padding: 18px 20px; }
  .big { font-size: 20px; font-weight: 700; margin: 4px 0 8px; }
  .ok { color: #1a7f37; } .err { color: #c00; } .muted { color: #777; font-size: 12px; word-break: break-all; }
  button { font: inherit; padding: 7px 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; margin: 10px 8px 0 0; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  a { color: #1f6feb; }
</style>
</head>
<body>
<main>
  <div id="title" class="big">処理中…</div>
  <div id="detail"></div>
  <div id="ops"></div>
  <p id="url" class="muted"></p>
</main>
<script>
/*
 * ブックマークレット「投稿を選ぶ」から開かれる小窓。
 * URL の # 以降に Instagram の投稿URLが入っている。
 * 管理画面と同じ接続設定（localStorage）を使って data/posts.json に追加・保存する。
 */
(function () {
  const LS = 'igFeedAdmin';
  const FILE = 'data/posts.json';
  const $ = (id) => document.getElementById(id);
  const say = (title, cls, detail) => { $('title').textContent = title; $('title').className = 'big ' + (cls || ''); $('detail').innerHTML = detail || ''; };
  const notify = () => { try { new BroadcastChannel('igfeed').postMessage({ type: 'picked' }); } catch (_) {} };

  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (_) {}

  // 管理画面と同じURL解析
  function parseUrl(s) {
    let u;
    try { u = new URL(s); } catch (_) { return null; }
    if (!/(^|\.)instagram\.com$/.test(u.hostname)) return null;
    const parts = u.pathname.split('/').filter(Boolean);
    const i = parts.findIndex((p) => ['p', 'reel', 'reels', 'tv'].includes(p));
    if (i < 0 || !parts[i + 1] || !/^[A-Za-z0-9_-]{5,}$/.test(parts[i + 1])) return null;
    const type = parts[i] === 'p' ? 'p' : (parts[i] === 'tv' ? 'tv' : 'reel');
    return { code: parts[i + 1], type, author: i === 1 ? parts[0].toLowerCase() : '', url: 'https://www.instagram.com/' + type + '/' + parts[i + 1] + '/' };
  }

  const b64enc = (str) => { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); }); return btoa(bin); };
  const b64dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
  async function gh(path, opts = {}) {
    const res = await fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + path, {
      ...opts,
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token, 'X-GitHub-Api-Version': '2022-11-28' },
    });
    if (!res.ok) {
      let msg = res.status + ' ' + res.statusText;
      try { const j = await res.json(); if (j.message) msg += ' — ' + j.message; } catch (_) {}
      const e = new Error(msg); e.status = res.status; throw e;
    }
    return res.json();
  }
  async function read() {
    const j = await gh('/contents/' + FILE + '?ref=' + encodeURIComponent(cfg.branch || 'main'));
    return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
  }
  async function write(data, sha, message) {
    data.updated_at = new Date().toISOString();
    await gh('/contents/' + FILE, { method: 'PUT', body: JSON.stringify({ message, sha, branch: cfg.branch || 'main', content: b64enc(JSON.stringify(data, null, 2) + '\n') }) });
  }

  // 読む→変更→書く。他で更新されていたら（409/422）読み直して1回だけやり直す
  async function update(fn, message) {
    for (let attempt = 0; ; attempt++) {
      const { sha, data } = await read();
      data.posts = Array.isArray(data.posts) ? data.posts : [];
      data.dismissed = Array.isArray(data.dismissed) ? data.dismissed : [];
      const result = fn(data);
      if (result === 'nochange' || result === 'already') return result; // 変更なしなら書き込まない
      try { await write(data, sha, message); return result; } catch (e) {
        if ((e.status === 409 || e.status === 422) && attempt === 0) continue;
        throw e;
      }
    }
  }

  const raw = decodeURIComponent(location.hash.slice(1));
  $('url').textContent = raw;
  const r = parseUrl(raw);
  const adminUrl = new URL('./', location.href).href;

  if (!r) {
    say('投稿のページではありません', 'err', '<p>Instagram で投稿を開いた状態（アドレスが /p/… や /reel/… のとき）で押してください。</p>');
    return;
  }
  if (!(cfg.owner && cfg.repo && cfg.token)) {
    say('接続設定がありません', 'err', '<p>このブラウザで<a href="' + adminUrl + '" target="_blank">管理画面</a>を開き、「接続設定」でトークンを入力して接続してから、もう一度押してください。</p>');
    return;
  }

  function showSelected(already) {
    say(already ? 'すでに選択済みです ✓' : '選びました ✓', 'ok', '<p>埋め込みへの反映まで1〜2分かかります。</p>');
    $('ops').innerHTML = '<button id="undo">選択を外す</button><button class="primary" id="close">閉じる</button>';
    $('close').onclick = () => window.close();
    $('undo').onclick = unselect;
    notify();
    if (!already) closeLater();
  }
  let timer = null;
  function closeLater() {
    timer = setTimeout(() => window.close(), 2500);
    document.addEventListener('mousemove', () => clearTimeout(timer), { once: true });
  }

  async function select() {
    say('保存中…');
    try {
      const res = await update((data) => {
        const p = data.posts.find((x) => x.code === r.code);
        if (p) {
          if (p.approved) return 'already';
          p.approved = true; p.reviewed = true;
          if (!p.author && r.author) p.author = r.author;
          return 'selected';
        }
        data.dismissed = data.dismissed.filter((c) => c !== r.code);
        // 選んだ順に、表示中の最後に並ぶ
        data.posts.push({ code: r.code, url: r.url, author: r.author, source: 'manual', added_at: new Date().toISOString(), approved: true, reviewed: true, note: '' });
        return 'selected';
      }, 'Select post ' + r.code);
      showSelected(res === 'already');
    } catch (e) {
      say('保存できませんでした', 'err', '<p>' + String(e.message).replace(/</g, '&lt;') + '</p>');
      $('ops').innerHTML = '<button class="primary" id="retry">もう一度</button>';
      $('retry').onclick = select;
    }
  }

  async function unselect() {
    clearTimeout(timer);
    say('保存中…');
    try {
      await update((data) => {
        const p = data.posts.find((x) => x.code === r.code);
        if (!p || !p.approved) return 'nochange';
        p.approved = false; p.reviewed = true;
      }, 'Unselect post ' + r.code);
      say('選択を外しました', '', '');
      $('ops').innerHTML = '<button id="redo">やっぱり選ぶ</button><button class="primary" id="close">閉じる</button>';
      $('redo').onclick = select;
      $('close').onclick = () => window.close();
      notify();
    } catch (e) {
      say('保存できませんでした', 'err', '<p>' + String(e.message).replace(/</g, '&lt;') + '</p>');
    }
  }

  select();
})();
</script>
</body>
</html>
