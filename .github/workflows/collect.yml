name: Collect Instagram candidates

on:
  schedule:
    - cron: '17 21 * * *'   # 毎日 6:17 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          ENABLE_HASHTAG: ${{ vars.ENABLE_HASHTAG }}
          MAX_PER_SOURCE: ${{ vars.MAX_PER_SOURCE }}
        run: node scripts/collect.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet data/posts.json && [ -z "$(git status --porcelain data/collect_status.json)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/collect_status.json
          git commit -m "Collect new Instagram candidates"
          git push
