<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Feed</title>
<style>
  :root {
    --size: 240px;     /* ?size= で変更（写真の一辺） */
    --card-w: 326px;   /* ?w= で変更（アカウント枠の幅） */
    --gap: 12px;
    --bg: transparent; /* ?bg= で変更（例 bg=ffffff） */
  }
  html, body { margin: 0; background: var(--bg); font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  .wrap { position: relative; }
  .track {
    display: flex; align-items: flex-start; gap: var(--gap);
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth; scroll-padding-inline: 12px;
    padding: 8px 12px 12px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
    user-select: none; -webkit-user-select: none; /* ドラッグで写真が選択状態（青）にならないように */
  }
  /* 写真だけのサムネイル：高さをそろえ、幅は投稿の縦横比に合わせる（JS で幅と拡大率を設定） */
  .thumb {
    flex: 0 0 auto; width: calc(var(--size) * 0.8); height: var(--size);
    position: relative; overflow: hidden; scroll-snap-align: start;
    border-radius: 8px; background: #eee; cursor: pointer;
  }
  /* 公式埋め込みを幅540pxで読み込み（縮小して使うので画像がぼやけない）、ヘッダーを隠して写真の部分だけが枠に収まるよう縮小・移動する */
  .thumb iframe {
    position: absolute; top: 0; left: 0; border: 0;
    width: 540px; height: 1100px; transform-origin: 0 0;
    pointer-events: none;
  }
  .thumb .hit { position: absolute; inset: 0; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; z-index: 1; }
  .thumb .hit:hover { background: rgba(0,0,0,.08); }
  .thumb .hit:focus-visible { outline: 3px solid #1f6feb; outline-offset: -3px; }
  /* 一覧でも操作できるモード（既定）：埋め込みを直接操作でき（動画の再生・複数枚の切り替え）、詳細は右上のボタンから */
  .interactive .thumb { cursor: default; }
  .interactive .thumb iframe { pointer-events: auto; }
  .interactive .thumb .hit {
    inset: auto; top: 6px; right: 6px; z-index: 2;
    padding: 3px 10px; border-radius: 12px; background: rgba(0,0,0,.55); color: #fff;
    font: 600 12px system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  .interactive .thumb .hit:hover { background: rgba(0,0,0,.75); }
  .thumb .who {
    position: absolute; left: 6px; bottom: 6px; z-index: 1; pointer-events: none;
    max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; color: #fff; background: rgba(0,0,0,.5); padding: 2px 7px; border-radius: 10px;
  }
  .thumb .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px; }
  .card {
    flex: 0 0 var(--card-w); scroll-snap-align: start;
    background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .card iframe { display: block; width: 100%; border: 0; background: #fafafa; }
  .card .ph { display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; background: #fafafa; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 22px; line-height: 40px;
    cursor: pointer; padding: 0;
  }
  .nav:hover { background: rgba(0,0,0,.75); }
  .prev { left: 4px; } .next { right: 4px; }
  .nav[hidden] { display: none; }
  .empty { padding: 24px; color: #888; text-align: center; font-size: 14px; }

  /* 詳細（クリックで開く） */
  .modal { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.72); overflow-y: auto; }
  .modal[hidden] { display: none; }
  .modal .box { position: relative; width: min(540px, calc(100% - 24px)); margin: 12px auto; background: #fff; border-radius: 8px; overflow: hidden; }
  .modal .bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #fff; border-bottom: 1px solid #eee; }
  .modal .bar button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #f1f1f1; font-size: 18px; cursor: pointer; }
  .modal .bar button:disabled { opacity: .35; cursor: default; }
  .modal .bar a { flex: 1; text-align: center; font-size: 12px; color: #1f6feb; text-decoration: none; }
  .modal iframe { display: block; width: 100%; height: 700px; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <button class="nav prev" type="button" aria-label="前へ" hidden>&#8249;</button>
  <div class="track" id="track"></div>
  <button class="nav next" type="button" aria-label="次へ" hidden>&#8250;</button>
</div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <div class="bar">
      <button type="button" id="mPrev" aria-label="前の投稿">&#8249;</button>
      <a id="mOpen" href="#" target="_blank" rel="noopener">Instagram で見る ↗</a>
      <button type="button" id="mNext" aria-label="次の投稿">&#8250;</button>
      <button type="button" id="mClose" aria-label="閉じる">&times;</button>
    </div>
    <iframe id="mFrame" title="Instagram post" scrolling="no" allow="encrypted-media"></iframe>
  </div>
</div>

<script>
/*
 * 選んだ投稿（approved: true）を「写真だけ」横スクロールで並べ、クリックで詳細（本文付きの公式埋め込み）を開く。
 * 写真のサムネイルは公式埋め込み（/p/{code}/embed/）のヘッダーと下の部分を隠し、写真の部分だけを縮小したもの。画像をコピーしないので、
 * 投稿者が削除・非公開にすると自動的に表示されなくなる。
 *
 * URLパラメータ:
 *   size=240     写真の高さ(px)。幅は投稿の縦横比に合わせる
 *   auto=5       5秒ごとに自動スクロール（0で無効）
 *   max=50       表示する最大件数
 *   bg=ffffff    背景色（16進、#なし）
 *   who=0        写真の上の「@投稿者名」を出さない
 *   detail=link  詳細を開かず、Instagram の投稿ページを新しいタブで開く
 *   interact=0   一覧の写真は操作できないようにし、写真のどこをクリックしても詳細を開く
 *                （既定は一覧でも動画の再生・複数枚の切り替えができ、詳細は右上の「詳細」ボタンから）
 *   w=326        アカウント枠の幅（アカウント枠を表示するときのみ）
 *   user=a,b     表示するアカウント枠を直接指定（posts.json の profiles より優先）
 *   posts=0      個別の投稿を表示しない（アカウント枠だけ表示）
 *   data=...     posts.json の場所（通常は不要）
 *
 * 詳細はこの埋め込みの枠の中に開くので、サイト側の iframe の高さが低いと詳細も小さくなる
 * （詳細内はスクロールできる）。枠を低くしたい場合は detail=link を使う。
 */
(function () {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => { const n = parseInt(q.get(k), 10); return Number.isFinite(n) && n > 0 ? n : d; };
  const size = Math.min(600, Math.max(120, num('size', 240)));
  const cardW = num('w', 326);
  const autoSec = parseFloat(q.get('auto') || '0');
  const max = num('max', 50);
  const showWho = q.get('who') !== '0';
  const detailLink = q.get('detail') === 'link';
  const interactive = q.get('interact') !== '0';
  if (interactive) document.documentElement.classList.add('interactive');
  const dataUrl = q.get('data') || 'data/posts.json';
  const userParam = q.get('user');
  const showPosts = q.get('posts') !== '0';
  // アカウント埋め込みの高さ（ヘッダー＋3列×2段のサムネイル）。MEASURE が来ればそちらを使う
  const profileH = Math.round(cardW * 2 / 3 + 152);
  if (q.get('bg')) document.documentElement.style.setProperty('--bg', '#' + q.get('bg').replace(/[^0-9a-fA-F]/g, ''));
  document.documentElement.style.setProperty('--size', size + 'px');
  document.documentElement.style.setProperty('--card-w', cardW + 'px');

  const $ = (id) => document.getElementById(id);
  const track = $('track');
  const prev = document.querySelector('.prev');
  const next = document.querySelector('.next');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let posts = [];

  // 画面に近づいたものから iframe を読み込む
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      const el = e.target;
      io.unobserve(el);
      const f = document.createElement('iframe');
      f.setAttribute('scrolling', 'no');
      f.setAttribute('tabindex', '-1');
      if (el.dataset.user) {
        f.src = 'https://www.instagram.com/' + encodeURIComponent(el.dataset.user) + '/embed/';
        f.title = 'Instagram @' + el.dataset.user;
        f.style.height = profileH + 'px';
        el.replaceChildren(f);
      } else {
        f.src = 'https://www.instagram.com/p/' + encodeURIComponent(el.dataset.code) + '/embed/';
        f.title = '';
        f.setAttribute('aria-hidden', 'true');
        el.querySelector('.ph').replaceWith(f);
        layoutThumb(el, null);
      }
    });
  }, { root: track, rootMargin: '0px ' + (size * 3) + 'px' });

  /*
   * サムネイルの配置。公式埋め込み（幅540px）は
   *   ヘッダー 56px ＋ 写真の枠（高さは投稿の縦横比で決まる。縦長は最大 4:5）＋ 下の部分
   * で、ヘッダーと下の部分の合計は 208px で一定。なので MEASURE の高さから写真の枠の高さが分かる。
   * 動画（リール）は 4:5 の枠の中に 9:16 の映像が左右黒帯つきで入るので、映像の部分だけを切り出す。
   */
  const EW = 540, HEAD = 56, CHROME = 208, TRIM = 4;
  function layoutThumb(el, totalH) {
    let mediaH = totalH ? totalH - CHROME : EW * 1.25; // 高さが分かるまでは 4:5 と仮定
    if (!(mediaH > 40)) mediaH = EW * 1.25;
    let visW = EW, left = 0;
    if (el.dataset.kind === 'reel' && Math.abs(mediaH - EW * 1.25) < 4) {
      visW = Math.round(mediaH * 9 / 16); // 黒帯を除いた映像の幅
      left = (EW - visW) / 2;
    }
    const visH = mediaH - TRIM; // 枠の端の白い線が入らないよう少しだけ内側
    const scale = size / visH;
    el.style.width = Math.round(visW * scale) + 'px';
    const f = el.querySelector('iframe');
    if (f) f.style.transform = 'translate(' + (-left * scale) + 'px,' + (-HEAD * scale) + 'px) scale(' + scale + ')';
    updateNav();
  }

  // サムネイル・詳細・アカウント枠は、公式埋め込みが送ってくる高さを使う
  window.addEventListener('message', (ev) => {
    if (!/^https:\/\/(www\.)?instagram\.com$/.test(ev.origin)) return;
    let d = ev.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || d.type !== 'MEASURE' || !d.details || !d.details.height) return;
    for (const f of document.querySelectorAll('.thumb iframe')) {
      if (f.contentWindow === ev.source) { layoutThumb(f.closest('.thumb'), d.details.height); return; }
    }
    for (const f of document.querySelectorAll('#mFrame, .card iframe')) {
      if (f.contentWindow === ev.source) { f.style.height = Math.ceil(d.details.height) + 'px'; break; }
    }
  });

  // ---------- 詳細 ----------
  let cur = -1;
  function openDetail(i) {
    const p = posts[i]; if (!p) return;
    if (detailLink) { window.open(p.url || 'https://www.instagram.com/p/' + p.code + '/', '_blank', 'noopener'); return; }
    cur = i;
    $('mFrame').style.height = '700px';
    $('mFrame').src = 'https://www.instagram.com/p/' + encodeURIComponent(p.code) + '/embed/captioned/';
    $('mOpen').href = p.url || 'https://www.instagram.com/p/' + p.code + '/';
    $('mPrev').disabled = i <= 0;
    $('mNext').disabled = i >= posts.length - 1;
    const wasHidden = $('modal').hidden;
    $('modal').hidden = false;
    $('modal').scrollTop = 0;
    paused = true;
    if (wasHidden) $('mClose').focus();
  }
  function closeDetail() {
    $('modal').hidden = true;
    $('mFrame').src = 'about:blank';
    paused = false;
    const t = track.querySelector('.thumb[data-i="' + cur + '"] .hit');
    if (t) t.focus({ preventScroll: true });
    cur = -1;
  }
  $('mPrev').addEventListener('click', () => openDetail(cur - 1));
  $('mNext').addEventListener('click', () => openDetail(cur + 1));
  $('mClose').addEventListener('click', closeDetail);
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeDetail(); });
  document.addEventListener('keydown', (e) => {
    if ($('modal').hidden) return;
    if (e.key === 'Escape') closeDetail();
    if (e.key === 'ArrowLeft' && cur > 0) openDetail(cur - 1);
    if (e.key === 'ArrowRight' && cur < posts.length - 1) openDetail(cur + 1);
  });
  track.addEventListener('click', (e) => {
    if (!e.target.closest('.hit')) return;
    openDetail(Number(e.target.closest('.thumb').dataset.i));
  });

  // ---------- 横スクロール ----------
  function step() { return Math.max(size + 12, track.clientWidth * 0.8); }
  function updateNav() {
    const maxScroll = track.scrollWidth - track.clientWidth;
    prev.hidden = track.scrollLeft <= 4;
    next.hidden = track.scrollLeft >= maxScroll - 4;
  }
  prev.addEventListener('click', () => track.scrollBy({ left: -step() }));
  next.addEventListener('click', () => track.scrollBy({ left: step() }));
  track.addEventListener('scroll', updateNav, { passive: true });
  window.addEventListener('resize', updateNav);

  // 自動スクロール（マウスが乗っている間・タッチ操作中・詳細表示中は止める）
  let paused = false;
  ['mouseenter', 'touchstart', 'focusin'].forEach((t) => track.parentElement.addEventListener(t, () => { paused = true; }, { passive: true }));
  ['mouseleave', 'touchend', 'focusout'].forEach((t) => track.parentElement.addEventListener(t, () => { if ($('modal').hidden) paused = false; }, { passive: true }));
  if (autoSec > 0) {
    setInterval(() => {
      if (paused || document.hidden) return;
      const maxScroll = track.scrollWidth - track.clientWidth;
      if (track.scrollLeft >= maxScroll - 4) track.scrollTo({ left: 0 });
      else track.scrollBy({ left: size + 12 });
    }, autoSec * 1000);
  }

  fetch(dataUrl + (dataUrl.includes('?') ? '&' : '?') + 't=' + Date.now())
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch((e) => { if (userParam != null) return {}; throw e; }) // user= 指定時はデータが無くても表示
    .then((data) => {
      const valid = (u) => /^[A-Za-z0-9._]{1,30}$/.test(u);
      const profiles = (userParam != null ? userParam.split(',') : (data.show_profiles === true ? (data.profiles || []) : []))
        .map((u) => String(u).trim().replace(/^@/, '')).filter(valid);
      posts = showPosts ? (data.posts || []).filter((p) => p.approved && p.code).slice(0, max) : [];
      if (!posts.length && !profiles.length) {
        track.innerHTML = '<div class="empty">表示する投稿がありません</div>';
        return;
      }
      profiles.forEach((u) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.user = u;
        card.innerHTML = '<div class="ph" style="height:' + profileH + 'px">読み込み中…</div>';
        track.appendChild(card);
        io.observe(card);
      });
      posts.forEach((p, i) => {
        const t = document.createElement('div');
        t.className = 'thumb';
        t.dataset.code = p.code;
        t.dataset.kind = /\/(reels?|tv)\//.test(p.url || '') ? 'reel' : 'p';
        t.dataset.i = i;
        t.innerHTML = '<div class="ph">読み込み中…</div>' +
          (showWho && p.author ? '<span class="who">@' + esc(p.author) + '</span>' : '') +
          '<button type="button" class="hit" aria-label="' + esc((p.author ? '@' + p.author + ' の' : '') + '投稿の詳細を見る') + '">' + (interactive ? (detailLink ? 'Instagram ↗' : '詳細') : '') + '</button>';
        track.appendChild(t);
        io.observe(t);
      });
      updateNav();
    })
    .catch((e) => {
      track.innerHTML = '<div class="empty">読み込みに失敗しました (' + esc(e.message) + ')</div>';
    });
})();
</script>
</body>
</html>
